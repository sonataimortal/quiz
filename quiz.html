<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Quiz das Correntes de Magos</title>
  <style>
    body {
      font-family: Georgia, serif;
      background: #0e0e11;
      color: #eee;
      padding: 40px;
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    #quiz-box {
      background: #1a1a22;
      padding: 25px;
      border-radius: 8px;
    }

    button {
      display: block;
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      font-size: 16px;
      background: #2a2a3a;
      color: #eee;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #3a3a55;
    }

    .resultado {
      margin-top: 20px;
      padding: 20px;
      background: #121218;
      border-radius: 8px;
    }

    .destaque {
      font-size: 20px;
      margin-top: 15px;
      color: #ffd479;
    }
  </style>
</head>
<body>

<h1>Quiz das Correntes de Magos</h1>

<div id="quiz-box">
  <p id="pergunta"></p>
  <div id="opcoes"></div>
</div>

<script>
  const correntes = {
    A: "Acadêmicos das Torres",
    B: "Conciliábulo das Bruxas",
    C: "Irmandade Xamânica"
  };

  let pontuacao = { A: 0, B: 0, C: 0 };
  let indice = 0;

  const perguntas = [
    {
      texto: "1- Escolha um familiar:",
      opcoes: [
        { texto: "Gato", valor: "A" },
        { texto: "Corvo", valor: "B" },
        { texto: "Lagarto", valor: "C" }
      ]
    },
    {
      texto: "2- Escolha um cajado:",
      opcoes: [
        { texto: "Um elegante bastão de prata", valor: "A" },
        { texto: "Cedro polido com runas e rubi na ponta", valor: "B" },
        { texto: "Um galho antigo e retorcido da floresta", valor: "C" }
      ]
    },
    {
      texto: "3- Escolha um influenciador fora de moda:",
      opcoes: [
        { texto: "Átila Lamarino", valor: "A" },
        { texto: "Rita Von Hunty", valor: "B" },
        { texto: "Jout Jout", valor: "C" }
      ]
    },
    {
      texto: "4- Escolha um filme de terror da A24:",
      opcoes: [
        { texto: "O Farol", valor: "A" },
        { texto: "Hereditário", valor: "B" },
        { texto: "Midsommar", valor: "C" }
      ]
    },
    {
      texto: "5- Escolha um passeio turístico:",
      opcoes: [
        { texto: "Museu", valor: "A" },
        { texto: "Vida noturna", valor: "B" },
        { texto: "Trilha", valor: "C" }
      ]
    },
    {
      texto: "6- Escolha um partido de esquerda para sair candidato:",
      opcoes: [
        { texto: "PSB", valor: "A" },
        { texto: "PSTU", valor: "B" },
        { texto: "PV", valor: "C" }
      ]
    },
    {
      texto: "7- Escolha uma banda:",
      opcoes: [
        { texto: "Titãs", valor: "A" },
        { texto: "Os Mutantes", valor: "B" },
        { texto: "Tribalistas", valor: "C" }
      ]
    },
    {
      texto: "8- Escolha um hobbie:",
      opcoes: [
        { texto: "Ler", valor: "A" },
        { texto: "Ouvir música", valor: "B" },
        { texto: "Ir pra praia", valor: "C" }
      ]
    },
    {
      texto: "9- Escolha sua droga:",
      opcoes: [
        { texto: "Café", valor: "A" },
        { texto: "Álcool", valor: "B" },
        { texto: "Cannabis", valor: "C" }
      ]
    },
    {
      texto: "10- Escolha sua tendência 2025:",
      opcoes: [
        { texto: "Bobbie Goods", valor: "A" },
        { texto: "Labubu", valor: "B" },
        { texto: "Morango do amor", valor: "C" }
      ]
    },
    {
      texto: "11- Escolha um caminho da magia:",
      opcoes: [
        { texto: "Alquimia", valor: "A" },
        { texto: "Necromancia", valor: "B" },
        { texto: "Transmutação", valor: "C" }
      ]
    },
    {
      texto: "12- Com qual corrente você MENOS se identifica?",
      opcoes: [
        { texto: "Conciliábulo das Bruxas", valor: "A" },
        { texto: "Irmandade Xamânica", valor: "B" },
        { texto: "Acadêmicos das Torres", valor: "C" }
      ]
    }
  ];

  function embaralhar(array) {
    return array.sort(() => Math.random() - 0.5);
  }

  function mostrarPergunta() {
    const perguntaAtual = perguntas[indice];
    document.getElementById("pergunta").textContent = perguntaAtual.texto;

    const opcoesDiv = document.getElementById("opcoes");
    opcoesDiv.innerHTML = "";

    const opcoesEmbaralhadas = embaralhar([...perguntaAtual.opcoes]);

    opcoesEmbaralhadas.forEach(opcao => {
      const btn = document.createElement("button");
      btn.textContent = opcao.texto;
      btn.onclick = () => {
        pontuacao[opcao.valor]++;
        indice++;
        indice < perguntas.length ? mostrarPergunta() : mostrarResultado();
      };
      opcoesDiv.appendChild(btn);
    });
  }

  function mostrarResultado() {
    const quizBox = document.getElementById("quiz-box");

    const vencedora = Object.keys(pontuacao)
      .reduce((a, b) => pontuacao[a] > pontuacao[b] ? a : b);

    quizBox.innerHTML = `
      <div class="resultado">
        <p><strong>Acadêmicos das Torres:</strong> ${pontuacao.A}</p>
        <p><strong>Conciliábulo das Bruxas:</strong> ${pontuacao.B}</p>
        <p><strong>Irmandade Xamânica:</strong> ${pontuacao.C}</p>

        <p class="destaque">
          ✨ Sua corrente dominante é:<br>
          <strong>${correntes[vencedora]}</strong>
        </p>
      </div>
    `;
  }

  mostrarPergunta();
</script>

</body>
</html>
